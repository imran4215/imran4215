name: 🐍 Generate Snake Animation

on:
  # Auto-runs every day at midnight UTC
  schedule:
    - cron: "0 0 * * *"

  # Allows manual trigger from Actions tab
  workflow_dispatch:

  # Also runs when pushed to main branch
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00FF88&color_dots=#0a0e17,#1a1a2e,#2d2d44,#3d3d5c,#4d4d74
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF0066&color_dots=#0d1117,#161b22,#21262d,#30363d,#484f58

      - name: 🚀 Deploy to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_branch: output
          publish_dir: ./dist
          github_token: ${{ secrets.GITHUB_TOKEN }}
